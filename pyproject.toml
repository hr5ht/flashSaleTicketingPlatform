[project]
name = "flash-sale-ticketing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.14.0",
    "pwdlib[argon2]==0.3.1",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "src.main:app"
